<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Parley favicon: a support-inbox envelope with a live status dot.
       Mirrors public/cadence/favicon.svg style: dark token bg + accent strokes. -->
  <rect width="32" height="32" rx="7" fill="#0d0b14"/>
  <g stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- envelope body -->
    <rect x="5" y="9" width="22" height="16" rx="3"/>
    <!-- the flap -->
    <polyline points="7,12 16,19 25,12"/>
  </g>
  <!-- the live/unread dot -->
  <circle cx="25" cy="8" r="2.5" fill="#f5cf8a"/>
</svg>
