<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Cadence favicon: a heartbeat/pulse line inside a calendar frame.
       Mirrors public/bazaar/favicon.svg style: dark token bg + accent strokes. -->
  <rect width="32" height="32" rx="7" fill="#0d0b14"/>
  <g stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- calendar frame -->
    <rect x="5" y="7" width="22" height="20" rx="3"/>
    <line x1="5" y1="13" x2="27" y2="13"/>
    <line x1="11" y1="4" x2="11" y2="8"/>
    <line x1="21" y1="4" x2="21" y2="8"/>
    <!-- heartbeat pulse line -->
    <polyline points="8,21 13,21 15,17 17,24 19,19 21,21 24,21"/>
  </g>
  <circle cx="26" cy="5" r="2" fill="#f5cf8a"/>
</svg>
