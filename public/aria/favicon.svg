<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Aria favicon: the two-speech-bubble CRM mark — a forward bubble
       (accounts/deals) answered by a return bubble (sequences/outbound).
       Mirrors public/parley/favicon.svg style: dark token bg + two-tone
       strokes, one warm accent dot. -->
  <rect width="32" height="32" rx="7" fill="#0d0b14"/>
  <g stroke="#4ade80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- forward bubble (top-left) -->
    <path d="M5 7h13v9H10l-4 4z"/>
    <!-- the bubble's lines -->
    <line x1="8" y1="10.5" x2="15" y2="10.5"/>
    <line x1="8" y1="13.5" x2="13" y2="13.5"/>
  </g>
  <g stroke="#f5cf8a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- return bubble (bottom-right) -->
    <path d="M27 16h-13v9h8l4 4z"/>
    <!-- the bubble's lines -->
    <line x1="17" y1="19.5" x2="24" y2="19.5"/>
    <line x1="17" y1="22.5" x2="22" y2="22.5"/>
  </g>
</svg>
