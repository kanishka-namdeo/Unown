name: local-llm probe

# Cross-platform validation lane for the local-model testbench (H6 in
# benchmarks/local-llm/hypotheses.json): proves the llama.cpp + small-GGUF
# lane starts, serves grammar-constrained JSON, and stays inside a modest RAM
# budget on every OS/arch Unown supports. Runs the KEYLESS experiments only
# (E0 probe + E1 triage in --no-remote mode) — comparison experiments against
# the remote baseline run where a bridge is reachable, not in CI.

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/local-llm/**"
      - ".github/workflows/local-llm-probe.yml"
  pull_request:
    paths:
      - "benchmarks/local-llm/**"
      - ".github/workflows/local-llm-probe.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every step below is keyless and credential-free: an npm install, model
# weights over anonymous HTTPS, and node. This was the one lane family where
# the block had drifted — complementary-probe.yml declared it, these two did
# not, so they ran on whatever the repository default hands out.
permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Renders unit tests (receipt null-safety — red-run 39123722085 class)
        # The experiment SUCCEEDED in that run; the receipt render crashed
        # (.toFixed on null in --no-remote mode). Gate the render layer
        # before spending provision time: no model, no server, no key.
        # Quoted glob: node expands it (node >= 21), works on all three OSes.
        run: node --test "benchmarks/local-llm/**/*.test.mjs"

      - name: Provision llama.cpp + Qwen3-0.6B Q4_K_M
        run: node benchmarks/local-llm/runner.mjs provision --models qwen3-0.6b
        env:
          # pinned in lib/llama.mjs; keep env override for quick bumps
          LLAMA_BUILD: b11718

      - name: E0 capability probe (startup / RAM / tok/s / json_schema)
        run: node benchmarks/local-llm/runner.mjs probe qwen3-0.6b

      - name: E1 note triage, local-only (fixtures, no API key)
        run: node benchmarks/local-llm/runner.mjs e1-triage --model qwen3-0.6b --no-remote --notes 8

      - name: Assert H6 thresholds
        shell: node {0}
        run: |
          const fs = require("fs");
          const glob = require("path").join("benchmarks", "local-llm", "results");
          const dirs = fs.readdirSync(glob).filter((d) => d.startsWith("probe"));
          if (!dirs.length) { console.error("no probe results dir"); process.exit(1); }
          const newest = dirs
            .map((d) => ({ d, m: fs.statSync(require("path").join(glob, d, "e0-probe.json")).mtimeMs }))
            .sort((a, b) => b.m - a.m)[0].d;
          const probe = JSON.parse(fs.readFileSync(require("path").join(glob, newest, "e0-probe.json"), "utf8"));
          const r = probe.results.find((x) => x.model === "qwen3-0.6b");
          console.log(JSON.stringify(r, null, 1));
          const fail = [];
          if (!r.jsonSchemaOk) fail.push("json_schema constrained decoding did not work");
          if (r.startupMs > 30000) fail.push("startup > 30s: " + r.startupMs + "ms");
          if (r.rssMB > 1500) fail.push("RSS > 1.5GB for the 0.6B lane: " + r.rssMB + "MB");
          if (fail.length) { console.error("H6 THRESHOLD FAILURES:\n- " + fail.join("\n- ")); process.exit(1); }
          console.log("H6 thresholds OK on " + process.platform);

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: local-llm-probe-${{ matrix.os }}
          path: benchmarks/local-llm/results/
          retention-days: 14
