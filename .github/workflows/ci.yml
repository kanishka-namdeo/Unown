name: CI

on:
  push:
    branches: [main]
  pull_request:

# Required CI gates (docs/testing-strategy.md §3, §6): lint, typecheck, unit tests,
# changed-line coverage, docs links/anchors, shell syntax, theme contract, landing
# palette, secret scan, advisory audit. The mermaid render check and the build job
# are deliberately deferred — see the trailing comments.

jobs:
  lint:
    name: Lint dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bunx eslint src

  typecheck:
    name: Typecheck dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma client
        # src/generated/prisma is gitignored output; tsc needs it for src/lib/db.ts
        run: bun run db:generate
      - name: Typecheck
        run: bun run typecheck

  unit:
    name: Unit tests (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Unit tests
        # bun:test is built in — no vitest/jest config or extra deps needed
        run: bun test src

  coverage:
    name: Changed-line coverage (src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so the gate can diff against the PR base
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run suite and enforce the changed-line coverage gate
        # testing-strategy.md §6 gate 9. The script runs `bun test src
        # --coverage` itself (byte-safe on every shell), fails on a red suite,
        # and treats an unparseable report as a hard error rather than a pass.
        run: node scripts/check_coverage.mjs --run "${{ github.event.pull_request.base.sha || github.event.before }}"

  docs:
    name: Docs links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Link, anchor and link-corruption gate
        # docs/AGENTS.md's Verification rules as a runnable check. Plain node, no
        # dependencies.
        run: node scripts/check_docs.mjs docs/*.md

  shell-syntax:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts/*.sh
        run: |
          failed=0
          for f in scripts/*.sh; do
            echo "bash -n $f"
            if ! bash -n "$f"; then
              echo "::error file=$f::syntax error"
              failed=1
            fi
          done
          exit $failed

  theme:
    name: Theme contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Theme schema check
        # bun (not node) because the script imports a .ts file from pi-repo
        run: bun scripts/check_theme.mjs

  landing-palette:
    name: Landing palette contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: GBA grid + AA contract
        # Reads the CSS only — no browser, no server, no build — which is what
        # makes the "every colour is a legal Game Boy Advance colour" claim a
        # gate rather than a caption.
        run: bun scripts/gba_palette_check.mjs

# NOT in CI yet, on purpose:
# - `bun run build` — heavy; Vercel already builds on every push. Phase 2 adds
#   it as a required gate before deploy (testing-strategy.md §3 gate 3, §6 gate 14).
# - scripts/mermaid_check.mjs — needs Playwright + browser binaries + CDN;
#   belongs to the screenshot/visual pipeline (Phase 2/3), not a cheap gate.
# - scripts/verify_sandbox.mjs / bwrap_smoke.sh — run only on changes under
#   sandbox/bwrap surfaces (testing-strategy.md §3 gate 6, Phase 3). Queued as
#   a `paths:`-filtered job (strategy §6 gate 13).
# - the engine suite (533 tests) and the bridge suite (95) are green and
#   hermetic but NOT wired here — the cheapest missing gate in the repository
#   (strategy §3.2, §11 step 1). Also still open: integration, build, E2E/axe.

  security:
    name: Security scan (secrets + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Advisory audit (root, production deps only)
        # `bun audit` exits non-zero on advisories; --prod keeps it to runtime
        # deps. Fail-open is NOT acceptable for known-exploited vulns, so a
        # finding here blocks the PR — triage by bumping the dependency.
        #
        # Documented triage (2026-10-17), all prisma-internal pins, revisit on
        # the next prisma minor:
        # - GHSA-ggr8-5vv4-36mx deepmerge-ts stack exhaustion via @prisma/config:
        #   our prisma config is static, no adversarial merge input.
        # - GHSA-rgwj-5xj2-c3m3 / GHSA-3f6p-5ww8-9rcr mysql2 (zlib bomb, auth
        #   downgrade): the runtime uses SQLite (@prisma/adapter-better-sqlite3);
        #   mysql2 is never connected to.
        run: bun audit --prod --ignore GHSA-ggr8-5vv4-36mx --ignore GHSA-rgwj-5xj2-c3m3 --ignore GHSA-3f6p-5ww8-9rcr
