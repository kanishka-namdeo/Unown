name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_cross_platform:
        description: "Run the macOS + Windows legs even though this commit does not bump the version (note: the concurrency group is keyed by ref, so dispatching while a push run is in flight cancels that run)"
        type: boolean
        required: false
        default: false

# Least-privilege token for the whole workflow (OpenSSF Token-Permissions):
# every CI job only needs to read the checkout. Jobs needing more carry
# their own block — which is now release.yml's shape too (workflow-wide
# `contents: read`, elevated per job), so this line is a description of the
# repo, not an exception carved out for the release path.
permissions:
  contents: read

# Cancel superseded runs of the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required CI gates (docs/testing-strategy.md §3, §6): lint, typecheck, unit
# tests, changed-line coverage, docs links/anchors, shell syntax, theme
# contract, landing palette, secret scan, advisory audit over EVERY installed
# manifest, mermaid byte-identity (gate 15), Playwright E2E + axe-core a11y
# (gate 16 — both this revision).
# What this file does NOT cover: the live deployment. Vercel deploys `main` on
# push, in parallel with these gates, so the page is proven by the Deploy
# verify lane (deploy-verify.yml), which runs scripts/verify-deploy.mjs after
# CI completes and daily on a schedule.
# Still deferred: Lighthouse — see the trailing comments.
#
# Cross-platform legs (M4):
#   - build-test exercises the REAL installer end to end: `bun scripts/install.ts`
#     with UNOWN_NO_LINK=1 runs both bun installs, the model-data hydration
#     (network) and build:offline — the exact path a fresh clone takes on a user
#     machine (~5-8 min per OS, hence the 30-minute job timeout). Then the
#     self-learning engine tests and a CLI boot smoke — the engine suite is a CI
#     gate from here on.
#     The matrix is three OSes, but only the ubuntu leg runs on every push/PR.
#     The macOS + Windows legs run when the commit bumps package.json's version
#     (the release candidate, i.e. the commit that gets tagged) or when a
#     workflow_dispatch forces them. The gate + the measured cost behind that
#     policy are documented on the cross-platform-gate job below; per-OS
#     verification for any other commit is xplat.yml's job
#     (`node scripts/xplat.mjs dispatch --scenario smoke --os macos-latest`),
#     which is what docs/xplat-testing.md has always been for.
#   - sandbox-smoke runs the repo-relative bwrap verification tools
#     (scripts/bwrap_smoke.sh + scripts/verify_sandbox.mjs) on ubuntu only —
#     the OS sandbox is a Linux surface (bwrap is a Linux ELF; src/bwrap.ts
#     gates the other platforms out by design).
#
# Landing + TUI honesty gates (this branch):
#   - coverage runs the changed-line coverage gate of strategy §6 gate 9:
#     `scripts/check_coverage.mjs --run` spawns `bun test src --coverage`
#     itself, fails on a red suite, and treats an unparseable report as a hard
#     error rather than a pass; threshold 80, exemptions in
#     scripts/coverage-exempt.txt.
#   - docs runs the docs link/anchor gate (`node scripts/check_docs.mjs
#     docs/*.md`) so a broken relative link or a renamed heading anchor fails
#     CI instead of a reader.
#   - instruction-chars lints the instruction set — every file the agent
#     loads as behavior (AGENTS.md / SKILL.md / CLAUDE.md at any depth,
#     .unown/**, hook configs, subagent definitions) — for invisible
#     Unicode: the emoji backdoor (Unicode Tags U+E0000-U+E007F), Trojan
#     Source bidi overrides/isolates, zero-width carriers, Sneaky-Bits
#     invisible operators, soft hyphen, variation-selector runs. Findings
#     are printed hex-escaped (CI logs never echo the payload); exemptions
#     live in scripts/instruction-chars-allowlist.txt (empty today).

jobs:
  lint-shell:
    name: Lint shell scripts (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bash -n scripts/*.sh public/*.sh
        run: |
          failed=0
          for f in scripts/*.sh public/*.sh; do
            [ -e "$f" ] || continue
            echo "bash -n $f"
            if ! bash -n "$f"; then
              echo "::error file=$f::syntax error"
              failed=1
            fi
          done
          exit $failed

  cross-platform-gate:
    name: Cross-platform gate (version bump?)
    # WHY THIS EXISTS — the arithmetic. build-test is CI's only per-OS lane and
    # by far its most expensive. Measured over the last 25 CI runs (2026-11-01):
    # ubuntu 4.3 min, macOS 4.5 min, Windows 8.1 min per run. GitHub bills a
    # macOS minute at 10x and a Windows minute at 2x a Linux minute, so of the
    # ~65 Linux-equivalent minutes one CI run burns, ~61 (93%) sit in the two
    # non-Linux legs. The 100 most recent CI runs covered ~49h of main, i.e.
    # ~50 runs a day most of which are docs or TUI commits no user ever installs
    # from — ~19k macOS+Windows runner-minutes a month spent re-verifying
    # intermediate commits.
    #
    # THE POLICY — spend the per-OS minutes where the verdict is owed:
    #   - the ubuntu leg NEVER skips. It is the lane that runs the real
    #     installer, the engine unit + integration suites, version consistency
    #     and the CLI smokes, at 1x cost. That stays the per-push gate.
    #   - the macOS + Windows legs run when package.json's version differs
    #     between the base and the head of the change — the release candidate,
    #     the commit that gets tagged — or when the dispatch input forces them.
    #   - a per-OS verdict for any other commit did not disappear, it moved to
    #     xplat.yml, which is agent-drivable on any ref without a push
    #     (docs/xplat-testing.md). That lane is the reason this gate is safe to
    #     pull: the capability is on-demand, not absent.
    #
    # WHAT IS NOT WEAKENED: release.yml installs on all three OSes and boots
    # every one of the six per-OS binaries on its own runner for each tag, and
    # its ci-green job still requires CI success on the tagged SHA. Nothing
    # ships that has not been run on its own OS.
    #
    # HOW IT READS THE VERSION: the contents API at two commit SHAs — no
    # checkout, no `fetch-depth: 0` over a repo carrying a vendored workspace.
    # An unreadable base (force-push, a pruned commit, a fork head the API will
    # not resolve) fails SAFE toward running the full matrix: the gate's own
    # blind spot must never be the reason a platform goes silent.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.decide.outputs.matrix }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Decide whether the macOS + Windows legs run
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.after }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          FORCE: ${{ github.event.inputs.force_cross_platform }}
        run: |
          set -uo pipefail

          version_at() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=$1" \
              --jq '.content' | tr -d '\n\r' | base64 -d \
              | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version"
          }

          per_os=false
          reason=""
          base=""
          head=""
          compare=false

          # Every read is default-expanded: the script runs under `set -u`, and
          # it has to stay runnable outside a runner (proving the decision
          # against real commits is how this gate is trusted).
          if [ "${FORCE:-}" = "true" ]; then
            per_os=true
            reason="forced by the force_cross_platform dispatch input"
          else
            case "${EVENT:-}" in
              push) base="${BEFORE:-}"; head="${AFTER:-${GITHUB_SHA:-}}"; compare=true ;;
              pull_request) base="${BASE:-}"; head="${PR_HEAD:-${GITHUB_SHA:-}}"; compare=true ;;
              *) reason="${EVENT:-this event} reports no base/head pair, so the per-OS legs skip (force them with the dispatch input)" ;;
            esac
            if [ "$compare" = "true" ]; then
              if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
                # A ref with no predecessor (first push, recreated branch) has no
                # version to diff against. "Unanswerable" must never read as
                # "no bump", so this fails safe the same way an unreadable one does.
                per_os=true
                reason="this ${EVENT} reports no base commit to diff against - failing safe to the full matrix"
              else
                bv="$(version_at "$base" 2>/dev/null || true)"
                hv="$(version_at "${head:-${GITHUB_SHA:-}}" 2>/dev/null || true)"
                if [ -z "$bv" ] || [ -z "$hv" ]; then
                  per_os=true
                  reason="could not read the version at base ${base:0:7} or head ${head:0:7} - failing safe to the full matrix"
                elif [ "$bv" != "$hv" ]; then
                  per_os=true
                  reason="version bump ${bv} -> ${hv}: the release candidate owes the three-OS verdict"
                else
                  reason="version unchanged at ${hv}: macOS + Windows skip, ubuntu still gates. On-demand per-OS verdict: node scripts/xplat.mjs dispatch --scenario smoke --os macos-latest"
                fi
              fi
            fi
          fi

          # The matrix is the mechanism, not an `if:` on the leg: a job-level
          # `if` has no `matrix` context (the runner rejects the expression), and
          # shrinking the array also means the ubuntu leg always reports its
          # required context. Invalid JSON here would break the job, so both
          # branches are literals.
          if [ "$per_os" = "true" ]; then
            matrix_json='["ubuntu-latest","macos-latest","windows-latest"]'
          else
            matrix_json='["ubuntu-latest"]'
          fi

          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "cross-platform gate -> build-test matrix: $matrix_json"
          echo "$reason"
          echo "::notice title=Cross-platform gate::build-test matrix = $matrix_json - $reason"

  build-test:
    name: Build + test (${{ matrix.os }})
    needs: cross-platform-gate
    strategy:
      fail-fast: false
      matrix:
        # ubuntu on every push; macOS + Windows only when the gate says the
        # version moved (testing-strategy.md §6 gate 22). An OS outside the
        # array boots no runner at all, and that absence IS the saving. This
        # cannot be done with a job-level `if`: the runner has no `matrix`
        # context there ("Unrecognized named-value: 'matrix'", run
        # 41241812344), and a leg skipped by a job `if` would also stop
        # reporting its required context.
        os: ${{ fromJSON(needs.cross-platform-gate.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Enable git long paths (Windows)
        # The vendored pi-repo trees (examples/**/node_modules) can exceed the
        # 260-char MAX_PATH limit. This must run BEFORE checkout so the action
        # sees the global config; git is preinstalled on the runner.
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Why this leg ran
        # One line of provenance: when a per-OS leg appears (or is missing) in
        # a release investigation, the job log should already say what decided
        # it instead of leaving the reader to guess at the gate.
        shell: bash
        env:
          GATE_REASON: ${{ needs.cross-platform-gate.outputs.reason }}
        run: |
          echo "cross-platform-gate (${{ github.event_name }}): $GATE_REASON"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Matches the repo badge + the bun-types devDependency pin.
          bun-version: "1.4.3"
      - name: Install via the real installer (bun installs + model-data hydration + build:offline)
        # UNOWN_NO_LINK=1 skips the PATH shim step (meaningless on a runner) —
        # everything else a fresh clone does runs for real here, including the
        # network hydration of pi-repo/packages/ai/src/providers/data (gitignored
        # upstream — without it build:offline cannot work on a fresh clone).
        env:
          UNOWN_NO_LINK: "1"
        run: bun scripts/install.ts
      - name: Self-learning engine tests
        # Live suites (UNOWN_MEMORY_LIVE / UNOWN_MEMORY_POISON) and the
        # integration suite (PI_TEST_SCOPE=integration) are env-gated and skip
        # under plain `bun test test/` — no extra env needed; test/_env.ts
        # redirects the DB/bridge away from anything live.
        working-directory: pi-repo/packages/self-learning
        run: bun test test/
      - name: Engine integration suite (real server + mock bridge)
        # testing-strategy.md §6 gate 12: 10 tests, in-process scratch engine
        # (ephemeral port, temp DB/data) against a mock OpenAI-compatible
        # bridge — hermetic, no network, runs on all three OSes. The env var
        # goes through `env:` (NOT the POSIX `VAR=x cmd` prefix, which
        # windows pwsh treats as a command name and fails).
        working-directory: pi-repo/packages/self-learning
        env:
          PI_TEST_SCOPE: integration
        run: bun test test/integration/
      - name: Version consistency (unown --version === package.json)
        # clig.dev: the version flag is a contract. The ROOT package.json is
        # the source of truth; cli.ts reads it directly — this asserts the
        # wiring never drifts (e.g. a moved file or a changed layout).
        # shell: bash is NOT optional on the windows leg: the runner default
        # shell is pwsh, and this step's POSIX `$(...)` / `if [ ... ]` syntax
        # is a ParserError under it. Found red in runs 39083708789 + 39084539734
        # — the same bug class the integration step's `env:` fix addressed one
        # commit earlier; this step was missed then.
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(bun bin/unown --version)
          echo "package.json: $expected / unown --version: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::version mismatch: package.json=$expected unown=$actual"
            exit 1
          fi
      - name: Smoke — CLI boots (unown --help)
        run: bun bin/unown --help
      - name: Smoke — dashboard TTY guard (non-TTY exits with guidance)
        # The TUI dashboard must refuse a non-interactive stdin with the
        # engine-API hint, not hang or crash — on every OS leg.
        shell: bash
        run: |
          out=$(bun bin/unown dashboard < /dev/null 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "needs an interactive terminal"
      - name: "Smoke — CLI surface (info, doctor --json, completions, changelog, update --check)"
        # The 2026 productization surface, non-interactively:
        #  - unown info / doctor --json must emit valid JSON (node -e parses it)
        #  - completions scripts must pass bash -n (zsh/fish syntax is pinned
        #    by content tests in the engine suite; bash is the shell every
        #    runner actually has)
        #  - changelog prints the current version's section
        #  - update --check talks to the real remote: accept 0 (up to date)
        #    and 2 (update available) — never 1 (offline/remote broken)
        shell: bash
        run: |
          bun bin/unown info --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);if(!j.platform)throw new Error('info json missing platform')})"
          # workspace-relative paths: bash's /tmp and node's /tmp DISAGREE on
          # Windows (msys temp vs drive root) — only bash may touch /tmp here
          bun bin/unown doctor --json > doctor-ci.json || code=$?
          code=${code:-0}
          if [ "$code" -gt 1 ]; then echo "::error::doctor --json crashed (exit $code)"; exit 1; fi
          node -e "const j=require('./doctor-ci.json');if(!Array.isArray(j.checks)||!j.checks.length)throw new Error('doctor json missing checks')"
          for sh in bash; do
            bun bin/unown completions "$sh" > "c-ci.$sh"
            bash -n "c-ci.$sh" || { echo "::error::$sh completion has syntax errors"; exit 1; }
          done
          bun bin/unown changelog | grep -q "full changelog" || { echo "::error::unown changelog printed no footer (command broken)"; exit 1; }
          # F23 (2026-10-30, the second excellence round): a macOS runner's
          # transient DNS failure ("Could not resolve host: github.com") once
          # reded this step — and with it all of main's CI — while the same
          # step passed on the other two OSes. Exit 1 means "offline/broken
          # remote"; a hosted runner's DNS blip is exactly the transient
          # class a single bounded retry absorbs. Two strikes still fail.
          ucode=0
          bun bin/unown update --check || ucode=$?
          if [ "$ucode" -eq 1 ]; then
            echo "update --check exit 1 (offline/remote unreachable) — retrying once in 15s (F23: hosted-runner DNS blips are transient)"
            sleep 15
            ucode=0
            bun bin/unown update --check || ucode=$?
          fi
          if [ "$ucode" -ne 0 ] && [ "$ucode" -ne 2 ]; then
            echo "::error::unown update --check failed with exit $ucode (1 = offline/broken remote, twice)"
            exit 1
          fi
      - name: Smoke — doctor prints its table
        # Doctor exit-code semantics (self-learning src/cli.ts cmdDoctor):
        # hard-exit 1 on any ✗ chat-path row. In CI there is no stack and no
        # upstream key, so "model endpoint reachable" is an expected ✗ and
        # doctor exits 1 — deterministically, on all three OSes. Faking an
        # upstream (or starting the bridge with a dummy key) would make the
        # job green dishonestly. Instead this smoke asserts the CLI *boots and
        # prints the full doctor table* — a crash prints none of these rows —
        # and accepts exit codes {0,1}; anything higher fails the step.
        shell: bash
        run: |
          # Note: GH runs bash steps with -e; capture the exit code without
          # tripping errexit (`|| code=$?` keeps the assignment conditional).
          code=0
          out="$(bun bin/unown doctor 2>&1)" || code=$?
          printf '%s\n' "$out"
          if [ "$code" -gt 1 ]; then
            echo "::error::unown doctor crashed (exit $code)"
            exit 1
          fi
          for row in "agent dir" "model endpoint reachable" "OS sandbox" "self-learning engine"; do
            if ! printf '%s\n' "$out" | grep -q "$row"; then
              echo "::error::doctor table missing row: $row"
              exit 1
            fi
          done
      - name: Smoke — full stack boots, survives the launcher, and stops (all OSes; Windows bun#31603 + netstat-pid gate, POSIX lifecycle gate)
        # scripts/start.ts used to spawn every service with detached:true — the
        # exact pattern bun#31603 documents as broken on Windows (children die
        # with the parent), and nothing caught it: this Windows leg never
        # booted the stack. The launcher now uses the cmd /c start /b escape +
        # netstat pid resolution; audit M5 widens the gate to ALL THREE OSes
        # so the POSIX detach/setsid path (macOS + Linux) is proven by the
        # same contract, not just the Windows escape:
        #   1. agent:start brings bridge + engine up (dashboard is not asserted
        #      — next dev's cold start varies too much on a shared runner)
        #   2. the services SURVIVE the launcher's exit 20s later (the
        #      bun#31603 regression this gate exists for)
        #   3. agent:stop tears them down via the resolved pidfiles (netstat
        #      fallback on Windows, lsof on macOS, /proc sweep on Linux) and
        #      the ports go quiet
        # M7 note: the engine requires a bearer token now — the alive probe
        # attaches it from data/self-learning/engine.token (401 ≠ dead); the
        # post-stop probe treats ANY HTTP answer as still-alive.
        shell: bash
        run: |
          # Pre-clean: a stray engine on 3030 from an earlier step (a leaked
          # test child — the acp e2e once lost one to the M6 auto-start latch)
          # makes the launcher REUSE it ("already healthy", 401 counts as
          # present) and this gate then fails to authenticate against a token
          # this step never wrote. Start from a provably clean slate.
          bun run agent:stop >/dev/null 2>&1 || true
          sleep 2
          if node -e "fetch('http://127.0.0.1:3030/').then(()=>process.exit(0)).catch(()=>process.exit(1))"; then
            echo "::error::a process is still answering on :3030 before the smoke starts - leaked engine from an earlier step"
            exit 1
          fi
          bun run agent:start
          # The launcher exits right after its health wait; the services must
          # outlive it (bun#31603 would kill them with the parent).
          sleep 20
          answering() {
            node -e "
              fetch(process.argv[1])
                .then(() => process.exit(0))
                .catch(() => process.exit(1));
            " "$1"
          }
          authed_ok() {
            node -e "
              const fs = require('fs');
              const url = process.argv[1];
              let tok = '';
              try { tok = fs.readFileSync('data/self-learning/engine.token', 'utf8').trim(); } catch {}
              fetch(url, { headers: { Authorization: 'Bearer ' + tok } })
                .then(r => process.exit(r.ok ? 0 : 1))
                .catch(() => process.exit(1));
            " "$1"
          }
          if ! authed_ok http://127.0.0.1:3030/api/overview; then
            echo "::error::engine did not survive the launcher exit (bun#31603 regression on Windows / detach regression on POSIX)"
            exit 1
          fi
          if ! answering http://127.0.0.1:3031/health; then
            echo "::error::bridge did not survive the launcher exit (bun#31603 regression on Windows / detach regression on POSIX)"
            exit 1
          fi
          echo "stack alive 20s after launcher exit:"
          ls .run/*.pid 2>/dev/null || true
          bun run agent:stop
          sleep 5
          if answering http://127.0.0.1:3030/api/overview || answering http://127.0.0.1:3031/health; then
            echo "::error::agent:stop left a service answering on 3030/3031"
            exit 1
          fi
          echo "stack stopped cleanly (pid resolution + tree kill verified)"

  sandbox-smoke:
    name: Sandbox smoke (bwrap profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Allow unprivileged user namespaces (bubblewrap requirement)
        # Ubuntu 24.04 runner images ship kernel.apparmor_restrict_unprivileged_
        # userns=1, which makes every bwrap invocation fail with a confusing
        # "bwrap: Setting up uid map: Permission denied". Developer machines
        # and most distros keep this at 0; flip it back for the smoke run.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: bwrap profile verification
        # 25 isolation checks against the vendored bwrap (fs masking, network
        # namespace, runtime usability). Uses unprivileged user namespaces —
        # if the runner kernel ever refuses them this job goes red, which is
        # the intended canary for the engine's OS-sandbox surface.
        run: bash scripts/bwrap_smoke.sh
      - name: Engine sandbox verification
        # The integration points the engine actually uses (execInSandbox,
        # verifyInSandbox, the generated sandbox shell wrapper).
        run: bun scripts/verify_sandbox.mjs

  bridge:
    name: LLM bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Bridge unit suite (routing/throttle/failover/usage logic)
        # 181 tests, 176 hermetic (pure routing/thinking/throttle logic + the
        # usage-log suite + the failover serving-layer suite that spawns the
        # real bridge on an ephemeral port against two mock upstreams) and 5
        # env-gated live-VLM skips, sub-second, no node_modules, no external
        # network (mocks and the bridge under test all bind 127.0.0.1
        # ephemeral ports).
        working-directory: mini-services/llm-bridge
        run: bun test

  build:
    name: Production build (landing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        # testing-strategy.md §6 gate 14: `bun run build` = next build +
        # standalone static/ public/ copy. Vercel builds the landing page on
        # every push; this gate catches landing breakage (routes, standalone
        # server) before a release. The TUI dashboard's suites run in the
        # build-test matrix (pi-repo/packages/self-learning).
        run: bun run build
      - name: Standalone server smoke
        # The production entry must actually boot: NODE_ENV=production +
        # .next/standalone/server.js on a scratch port, then 200 on /.
        run: |
          PORT=3210 node .next/standalone/server.js &
          server_pid=$!
          for i in $(seq 1 30); do
            if curl -sf -m 2 http://127.0.0.1:3210/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf -m 5 http://127.0.0.1:3210/ >/dev/null || { echo "::error::landing route did not answer"; kill $server_pid; exit 1; }
          kill $server_pid
          echo "standalone server: / answered 200"

  lint:
    name: Lint (landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bunx eslint src

  typecheck:
    name: Typecheck (landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install
      - name: Typecheck
        run: bun run typecheck

  unit:
    name: Unit tests (landing)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install
      - name: Unit tests
        # bun:test is built in — no vitest/jest config or extra deps needed
        run: bun test src

  coverage:
    name: Changed-line coverage (src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history so the gate can diff against the PR base
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies
        run: bun install
      - name: Run suite and enforce the changed-line coverage gate
        # testing-strategy.md §6 gate 9. The script runs `bun test src
        # --coverage` itself (byte-safe on every shell), fails on a red suite,
        # and treats an unparseable report as a hard error rather than a pass.
        run: node scripts/check_coverage.mjs --run "${{ github.event.pull_request.base.sha || github.event.before }}"

  docs:
    name: Docs links and anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Docs link/anchor gate
        # docs/AGENTS.md's Verification rules as a runnable check: relative
        # targets exist, anchors match GitHub heading slugs, cross-file anchors
        # resolve. Plain node, no dependencies — the gate cannot rot when a
        # package breaks. On ubuntu `docs/*.md` is expanded by the shell; the
        # PowerShell glob limitation is a Windows-local concern only.
        run: node scripts/check_docs.mjs docs/*.md

  instruction-chars:
    name: Instruction-set unicode lint (invisible chars)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Workflow-level permissions are already contents:read; restated here so
    # the gate stays least-privilege even if the workflow header ever widens.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Invisible-unicode lint over the instruction set
        # The files the agent loads as behavior enter model context verbatim,
        # so an invisible code point inside one is a prompt injection no human
        # reviewer can see but the model reads as text. This is the CI leg of
        # research/instruction_set_hardening.md P0-1. Zero-dep plain node
        # (system node, like the docs gate — nothing to install, <1s); scans
        # the working tree at any depth, including the vendored pi-repo
        # instruction files and fixtures. Findings exit 1 with file/line/col,
        # the exact U+XXXX code points, and a hex-escaped excerpt — the log
        # never echoes the raw payload. Exemptions: only the checked-in
        # scripts/instruction-chars-allowlist.txt, and a malformed/unknown
        # rule in it is a hard config error, not a silent pass.
        run: node scripts/check_instruction_chars.mjs
      - name: Scanner unit tests
        # Pins the gate itself, so it cannot rot into a no-op: every char
        # class detected with line/col + code point, code-point (not
        # UTF-16) columns, run thresholds (two selectors pass, three fail,
        # mixed FE+MVS fails), never-echo output, --fix-hints modifies
        # nothing, allowlist narrow/loud/fail-closed, and the repo's own
        # instruction set scanning clean.
        run: node --test scripts/check_instruction_chars.test.mjs

  theme:
    name: Theme contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Theme schema check
        # bun (not node) because the script imports a .TS file from pi-repo
        run: bun scripts/check_theme.mjs

  landing-palette:
    name: Landing palette contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: GBA grid + AA contract
        # Reads the CSS only — no browser, no server, no build — which is what
        # makes the "every colour is a legal Game Boy Advance colour" claim a
        # gate rather than a caption.
        run: bun scripts/gba_palette_check.mjs
      - name: Changelog rail extraction
        # The parser's own regressions (duplicate bucket headings merging, a
        # bucket-level Agent Behavior flag leaking onto its sibling block, an
        # unknown heading being dropped instead of failing).
        run: node --test scripts/landing_changelog.test.mjs
      - name: Changelog rail matches CHANGELOG.md
        # The landing page's shipping rail is GENERATED from CHANGELOG.md. This
        # step is what turns "add a feature, the page follows" from a habit into
        # a contract: a changelog entry that never reached the rail fails here,
        # and so does a rail that invented a date.
        run: bun scripts/landing_changelog.mjs --check
      - name: Install dependencies for the blog gate
        # landing_blog.mjs is the one landing generator with a dependency
        # (marked, dev-only) — everything else in this job runs on node
        # builtins straight off the checkout.
        run: bun install --frozen-lockfile
      - name: Blog extraction
        # The generator's own regressions: the frontmatter subset grammar
        # (unknown/duplicate keys fail, not silently drop), the validation
        # bands (description 70-160 caught two real posts in the round that
        # shipped it), the dated-slug rule, draft skipping, reading-time
        # derivation, feed escaping.
        run: node --test scripts/landing_blog.test.mjs
      - name: Blog data matches content/blog
        # The same contract the changelog rail holds, for the blog: a post
        # that changed without the data being regenerated is a red build,
        # and so is a media path that stopped existing.
        run: node scripts/landing_blog.mjs --check
      - name: Benchmark receipt extraction
        # The canonical-run rule (newest `rerun-*` wins), the percentage
        # validation, and the null-for-missing-receipt path.
        run: node --test scripts/landing_benchmarks.test.mjs
      - name: Benchmark figures match the receipts
        # `benchmarks/` is the most-churned directory in the repo. Every figure
        # the landing page prints is read from a committed receipt JSON, so a run
        # that lands without the page being regenerated is a red build rather
        # than a stale number on the marketing site.
        run: bun scripts/landing_benchmarks.mjs --check
      - name: Engine claim extraction
        # The gate's own regressions: the template-prefix matcher, the
        # one-directional rule (an omitted command must NOT fail), the
        # wrapped-line join, and a literal that exists nowhere.
        run: node --test scripts/landing_claims.test.mjs
      - name: Page literals resolve in the engine
        # Two jobs in one script. It generates `engine-data.ts` from `JOB_DEFS`
        # so the page's job list and tallies are read from the scheduler rather
        # than retyped, and it gates every quoted engine string on the page —
        # hook-log reasons, harness log lines, the project-memory excerpt, CLI
        # command names — against the sources that write them. One direction
        # only: page implies source. HELP is a superset by design, so a command
        # the page omits must not fail, or the gate gets ignored.
        run: bun scripts/landing_claims.mjs --check

  security:
    name: Security scan (secrets + advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Advisory audit (every installed manifest, production deps)
        # `bun audit` exits non-zero on advisories; --prod keeps it to runtime
        # deps. Fail-open is NOT acceptable for known-exploited vulns, so a
        # finding here blocks the PR — triage by bumping the dependency.
        #
        # ROOT ONLY is not the whole dependency surface: package.json declares
        # no `workspaces`, so `bun audit` at the root cannot see a nested
        # manifest, and the nonllm bench lane installs its own
        # @huggingface/transformers + onnxruntime-node on every run of that
        # probe. Its package-lock.json is committed precisely so this audit is
        # a measurement of the pinned tree rather than a fresh resolution.
        # edit-bench is deliberately absent: it ships no lockfile, so npm audit
        # errors out (ENOLOCK) rather than answering — commit one, add it to
        # this list, and to dependabot, in the same change.
        #
        # (The 2026-10-17 triage list was three prisma-internal GHSA ignores —
        # deepmerge-ts via @prisma/config and two mysql2 advisories. D7 removed
        # the prisma scaffold from the dependency tree, so the ignores left with
        # it; the audit now runs clean of pinned exemptions.)
        shell: bash
        run: |
          set -euo pipefail
          bun audit --prod
          for dir in benchmarks/nonllm; do
            if [ ! -f "$dir/package-lock.json" ]; then
              echo "::error::$dir is on the audit list but has no committed package-lock.json"
              exit 1
            fi
            echo "npm audit --omit=dev in $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
          done

  mermaid:
    name: Mermaid byte-identity (gate 15)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install root deps (frozen — brings in playwright@1.64.1 from devDependencies)
        run: bun install --frozen-lockfile
      - name: Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: Byte-identity gate — parse + dual render + sha256
        # testing-strategy.md §6 gate 15. What fails CI here: a README diagram
        # that no longer parses under mermaid 11.16.1 (the version github.com
        # renders — vendored + sha-pinned at scripts/vendor/, so no CDN at run
        # time), or a render that stopped being deterministic. Mermaid 11.16.1's
        # shape generators sample Math.random; the gate pins it (see the
        # script header for the measured, found-live details).
        run: bun scripts/mermaid_check.mjs
      - name: Brand HTML layout gate (overflow)
        # Deterministic complement to the VLM design review: no brand source
        # may contain an element that scrolls beyond its box, and no page may
        # overflow horizontally. Reuses this job's chromium + network (Geist
        # via Google Fonts, same as the mermaid render page).
        run: bun scripts/check_overflow.mjs
      - name: Receipt artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mermaid-receipt
          path: download/brand/mermaid-receipt.json
          if-no-files-found: ignore

  e2e:
    name: E2E + a11y (landing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        # A dedicated job (not piggybacked on the build job's artifact) so the
        # e2e lane owns its own build. The web dashboard is retired (D7): the
        # remaining specs are the landing page's a11y + performance-budget
        # suites — no mock engine, no engine-dependent build env.
        run: bun run build
      - name: Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: "E2E: a11y + budget + dex video + SEO + blog (14 tests)"
        # testing-strategy.md §6 gate 16. Covers: axe-core WCAG 2.0/2.1 A+AA
        # scans of the landing page in both theme modes plus the scroll-
        # performance budget spec. The axe half of this gate already paid for
        # itself: its first run found 80+ real AA contrast defects, fixed in
        # src. (The dashboard specs left with the web dashboard — the TUI
        # dashboard's suites live in pi-repo/packages/self-learning/test/.)
        run: bunx playwright test
      - name: Upload report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            download/playwright-report
            download/test-results
          if-no-files-found: ignore
          retention-days: 7

  coda:
    name: Coda app (unit + e2e + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies (frozen lockfile)
        # Coda is the repo's zero-dependency app (apps/coda/package.json declares
        # NO dependencies/devDependencies). `--frozen-lockfile` + the assert
        # below make that a contract, not a hope: any dep a future Coda change
        # adds must show up in the root lockfile, and this step is where it
        # would red rather than silently growing the install surface.
        run: bun install --frozen-lockfile
      - name: Lockfile unchanged assert (Coda's zero-dep invariant)
        # The design doc's P0 dep-resolution guard. `--frozen-lockfile` makes
        # drift impossible in practice, but the assert is the documented
        # contract: capture sha256 before install, compare after, fail loudly
        # with the expected hash if it moved. The expected hash is read from
        # the git checkout (what this commit shipped) — not a hardcoded
        # constant that would need a manual bump every lockfile change.
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git show HEAD:bun.lock | sha256sum | cut -d' ' -f1)
          actual=$(sha256sum bun.lock | cut -d' ' -f1)
          echo "bun.lock: expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::bun.lock drifted after a --frozen-lockfile install: Coda added a dependency? (apps/coda must stay zero-dep; record a new root dep in the lockfile instead)"
            exit 1
          fi
          echo "lockfile byte-identical: Coda's zero-dep invariant holds"
      - name: Coda unit tests — Lane A (app-dir, DOM-free enforcement)
        # `cd apps/coda && bun test`: no bunfig preload applies (bun's config
        # resolution is cwd-bounded — no apps/coda/bunfig.toml exists), so the
        # happy-dom DOM globals are ABSENT and the domain-purity boundary
        # (src/domain/boundary.test.ts + the eslint no-restricted-globals scope)
        # is enforced against a genuinely DOM-free runtime. 51 tests.
        run: cd apps/coda && bun test
      - name: Coda unit tests — Lane B (root form, preload active, masked by design)
        # `bun test apps/coda` from the repo root: the root bunfig.toml's
        # happy-dom preload IS active here, so DOM-globally-dependent domain
        # code would be MASKED — which is why Lane A is the enforcement lane
        # and this lane is the compatibility lane (the form a developer will
        # actually type). boundary.test.ts still runs in this lane and still
        # enforces the import boundary, so the purity contract holds even
        # under the masked runtime. 51 tests.
        run: bun test apps/coda
      - name: Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: "Coda e2e + a11y lane (isolated, self-skip-guarded)"
        # testing-strategy.md §6 coda gate: the isolated Coda lane. The config
        # (playwright.coda.config.ts) boots Coda's own transpiling dev server
        # (bun apps/coda/scripts/serve.mjs) as its webServer — in CI the
        # `reuseExistingServer` flag is !process.env.CI, so the server always
        # starts fresh; no port collision with the landing lane. The 5 specs
        # are self-skip-guarded (CODA_E2E marker armed in the coda config, NOT
        # in the root config) so the root lane's `bunx playwright test` still
        # collects them but skips them at run-time — the landing lane stays
        # green and untouched by construction.
        run: bunx playwright test -c playwright.coda.config.ts
      - name: Upload Coda report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-coda
          path: |
            download/playwright-report-coda
            download/test-results-coda
          if-no-files-found: ignore
          retention-days: 7

  ostinato:
    name: Ostinato app (unit + e2e + a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies (frozen lockfile)
        # Ostinato is the repo's second zero-dependency app (apps/ostinato/
        # package.json declares NO dependencies/devDependencies) — the same
        # frozen-lockfile + hash-assert contract the coda job pins for Coda.
        run: bun install --frozen-lockfile
      - name: Lockfile unchanged assert (Ostinato's zero-dep invariant)
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git show HEAD:bun.lock | sha256sum | cut -d' ' -f1)
          actual=$(sha256sum bun.lock | cut -d' ' -f1)
          echo "bun.lock: expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::bun.lock drifted after a --frozen-lockfile install: Ostinato added a dependency? (apps/ostinato must stay zero-dep; record a new root dep in the lockfile instead)"
            exit 1
          fi
          echo "lockfile byte-identical: Ostinato's zero-dep invariant holds"
      - name: Ostinato unit tests — Lane A (app-dir, DOM-free enforcement)
        # `cd apps/ostinato && bun test`: no bunfig preload applies (bun's
        # config resolution is cwd-bounded — no apps/ostinato/bunfig.toml
        # exists), so the happy-dom DOM globals are ABSENT and the
        # domain-purity boundary (src/domain/boundary.test.ts) is enforced
        # against a genuinely DOM-free runtime. 93 tests.
        run: cd apps/ostinato && bun test
      - name: Ostinato unit tests — Lane B (root form, preload active, masked by design)
        # `bun test apps/ostinato` from the repo root: the root bunfig.toml's
        # happy-dom preload IS active here, so DOM-globally-dependent domain
        # code would be MASKED — which is why Lane A is the enforcement lane
        # and this lane is the compatibility lane. 93 tests.
        run: bun test apps/ostinato
      - name: Precache derivation proof (verify-precache)
        # The offline lane's static half: every PRECACHE_LIST URL in sw.js
        # must map to a real on-disk file (the Coda C3 pattern — an
        # improvement over the coda CI job, which runs verify-precache only
        # in the operator lane; the script is a sub-second fs walk).
        run: bun apps/ostinato/scripts/verify-precache.ts
      - name: Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: "Ostinato e2e battery (isolated, self-skip-guarded)"
        # The O-4 hardening battery: 12 tests across 5 specs (K-1 zero-mouse
        # flow, A-1 axe wcag2a/2aa both schemes, O-1 offline lanes, R-1
        # crash-resume + resize). playwright.ostinato.config.ts boots
        # Ostinato's own transpiling dev server (bun apps/ostinato/serve.mjs)
        # as its webServer on 127.0.0.1:4013; the OSTINATO_E2E marker arms in
        # the ostinato config ONLY, so the specs self-skip under the root
        # landing lane — it stays green and untouched by construction.
        run: bunx playwright test -c playwright.ostinato.config.ts
      - name: Upload Ostinato report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-ostinato
          path: |
            download/playwright-report-ostinato
            download/test-results-ostinato
          if-no-files-found: ignore
          retention-days: 7

  chaconne:
    name: Chaconne app (unit + e2e + PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies (frozen lockfile)
        # Chaconne is the repo's THIRD zero-dependency app (apps/chaconne/
        # package.json declares NO dependencies/devDependencies) — the same
        # frozen-lockfile + hash-assert contract the coda + ostinato jobs
        # pin for Coda and Ostinato.
        run: bun install --frozen-lockfile
      - name: Lockfile unchanged assert (Chaconne's zero-dep invariant)
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git show HEAD:bun.lock | sha256sum | cut -d' ' -f1)
          actual=$(sha256sum bun.lock | cut -d' ' -f1)
          echo "bun.lock: expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::bun.lock drifted after a --frozen-lockfile install: Chaconne added a dependency? (apps/chaconne must stay zero-dep; record a new root dep in the lockfile instead)"
            exit 1
          fi
          echo "lockfile byte-identical: Chaconne's zero-dep invariant holds"
      - name: Chaconne unit tests — Lane A (app-dir, DOM-free enforcement)
        # `cd apps/chaconne && bun test`: no bunfig preload applies (bun's
        # config resolution is cwd-bounded — no apps/chaconne/bunfig.toml
        # exists), so the happy-dom DOM globals are ABSENT and the
        # domain-purity boundary (src/domain/boundary.test.ts + the eslint
        # no-restricted-globals scope) is enforced against a genuinely
        # DOM-free runtime. 119 tests (incl. the runner's FakePageAdapter
        # unit lane: every step kind, every error taxonomy entry, the
        # caps, the committed-prefix law, the misfire policy — deterministic,
        # no browser).
        run: cd apps/chaconne && bun test
      - name: Chaconne unit tests — Lane B (root form, preload active, masked by design)
        # `bun test apps/chaconne` from the repo root: the root bunfig.toml's
        # happy-dom preload IS active here, so DOM-globally-dependent domain
        # code would be MASKED — which is why Lane A is the enforcement lane
        # and this lane is the compatibility lane (the form a developer will
        # actually type). 157 tests.
        run: bun test apps/chaconne
      - name: Precache derivation proof (verify-precache)
        # The offline lane's static half: every PRECACHE_LIST URL in sw.js
        # must map to a real on-disk file (the Ostinato O-5 pattern; the
        # script's three-way ladder — exact file → + ".ts" → the .js→.ts
        # swap — makes the proof a sub-second fs walk that fails loudly on
        # drift).
        run: bun apps/chaconne/scripts/verify-precache.ts
      - name: Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: "Chaconne e2e battery (isolated, self-skip-guarded, Chromium-desktop-only)"
        # The round's P0 honesty: Chromium-desktop-only PWA + runner scope.
        # The 20-spec battery (K-1 zero-mouse flow, A-1 axe wcag2a/2aa
        # both schemes + the tab-order + Esc focus-return pins, O-1
        # offline lanes, R-1 crash-resume + corrupt-store, I-1 io,
        # runner CLI) runs against LOCAL fixture pages — no live-network
        # test ever runs in CI. playwright.chaconne.config.ts boots the
        # app's own transpiling dev server (bun apps/chaconne/serve.mjs)
        # as its webServer on 127.0.0.1:4014; the CHACONNE_E2E marker
        # arms in the chaconne config ONLY, so the specs self-skip under
        # the root landing lane — it stays green and untouched by
        # construction.
        run: bunx playwright test -c playwright.chaconne.config.ts
      - name: Upload Chaconne report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chaconne
          path: |
            download/playwright-report-chaconne
            download/test-results-chaconne
          if-no-files-found: ignore
          retention-days: 7

  fugue:
    name: Fugue app (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies (frozen lockfile)
        # Fugue is the repo's FOURTH zero-dependency app (apps/fugue/
        # package.json declares NO dependencies/devDependencies) — the same
        # frozen-lockfile + hash-assert contract the coda/ostinato/chaconne
        # jobs pin for their siblings.
        run: bun install --frozen-lockfile
      - name: Lockfile unchanged assert (Fugue's zero-dep invariant)
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git show HEAD:bun.lock | sha256sum | cut -d' ' -f1)
          actual=$(sha256sum bun.lock | cut -d' ' -f1)
          echo "bun.lock: expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::bun.lock drifted after a --frozen-lockfile install: Fugue added a dependency? (apps/fugue must stay zero-dep; record a new root dep in the lockfile instead)"
            exit 1
          fi
          echo "lockfile byte-identical: Fugue's zero-dep invariant holds"
      - name: Fugue unit tests — Lane A (app-dir, DOM-free enforcement)
        # `cd apps/fugue && bun test`: the app directory's own bunfig.toml
        # applies, so the DOM-free runtime enforces the domain's DOM-free
        # boundary; the FakeEngineAdapter lane and the fixture contract
        # lane ride here. 283 tests / 31 files (the F-9 close numbers,
        # receipted in benchmarks/sonata-round/receipts/f9.md).
        run: cd apps/fugue && bun test
      - name: Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: "Fugue e2e battery (isolated, self-skip-guarded, Chromium-desktop-only)"
        # The Fugue e2e battery (smoke, flow, io, learning, a11y — 23
        # specs + 1 skip) runs against LOCAL fixture lane only: the
        # stub engine on 4130 (canned contract-pinned JSON) + the app's
        # own transpiling dev server (bun apps/fugue/serve.mjs) as the
        # config's webServer on 127.0.0.1:4015. The FUGUE_E2E marker
        # arms in the fugue config ONLY, so the specs self-skip under
        # the root landing lane — it stays green and untouched by
        # construction.
        #
        # THE LIVE LANE NEVER RUNS IN CI: the FUGUE_LIVE gate (the real
        # engine on 3030 + the $UNOWN_HOME/engine.token bearer) is the
        # operator's off-peak witness lane — create a routine through
        # the compose UI, run-now, watch the session note land back.
        # It needs a running engine; no live-network test ever runs in
        # CI (the PRD's P0 honesty law, the chaconne fixture-honesty
        # pattern).
        run: bunx playwright test -c playwright.fugue.config.ts
      - name: Upload Fugue report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-fugue
          path: |
            download/playwright-report-fugue
            download/test-results-fugue
          if-no-files-found: ignore
          retention-days: 7

  legato:
    name: Legato app (unit + e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install dependencies (frozen lockfile)
        # Legato is the repo's FIFTH zero-dependency app (apps/legato/
        # package.json declares NO dependencies/devDependencies) — the same
        # frozen-lockfile + hash-assert contract the coda/ostinato/chaconne/
        # fugue jobs pin for their siblings.
        run: bun install --frozen-lockfile
      - name: Lockfile unchanged assert (Legato's zero-dep invariant)
        shell: bash
        run: |
          set -euo pipefail
          expected=$(git show HEAD:bun.lock | sha256sum | cut -d' ' -f1)
          actual=$(sha256sum bun.lock | cut -d' ' -f1)
          echo "bun.lock: expected=$expected actual=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::bun.lock drifted after a --frozen-lockfile install: Legato added a dependency? (apps/legato must stay zero-dep; record a new root dep in the lockfile instead)"
            exit 1
          fi
          echo "lockfile byte-identical: Legato's zero-dep invariant holds"
      - name: Legato unit tests — Lane A (app-dir, DOM-free enforcement)
        # `cd apps/legato && bun test`: the app directory carries NO
        # bunfig.toml, so the DOM-free runtime enforces the domain's
        # DOM-free boundary; the FakeStorage + FakeFetcher lane rides here.
        # 222 tests / 26 files (207 pass / 15 skip / 0 fail, 884 expects —
        # the L-11 close numbers, receipted in
        # benchmarks/serenade-round/receipts/l11.md).
        run: cd apps/legato && bun test
      - name: Chromium for Playwright
        run: bunx playwright install chromium --with-deps
      - name: "Legato e2e battery (isolated, self-skip-guarded, Chromium-desktop-only)"
        # The Legato e2e battery (14 specs across 7 files: flow, queue,
        # hostile-clip, io, offline, a11y, cross-browser-smoke) runs against
        # the LOCAL fixture lane only: the hostile fixture server on 4018
        # (canned static + dynamic hostile HTML, zero live network) + the
        # app's own transpiling dev server (bun apps/legato/serve.mjs) as the
        # config's webServer on 127.0.0.1:4017. The LEGATO_E2E marker arms in
        # the legato config ONLY, so the specs self-skip under the root
        # landing lane — it stays green and untouched by construction.
        #
        # THE BROWSER-CLIP LANE NEVER RUNS IN CI: RealFetcher's real-world
        # clipping (window.fetch against arbitrary user-supplied URLs) is a
        # live-network path — no live-network test ever runs in CI (the PRD's
        # P0 honesty law, the chaconne fixture-honesty pattern). The 4018
        # fixture server stands in for the hostile web in every test lane.
        run: LEGATO_E2E=1 bunx playwright test -c playwright.legato.config.ts
      - name: Upload Legato report + traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-legato
          path: |
            download/playwright-report-legato
            download/test-results-legato
          if-no-files-found: ignore
          retention-days: 7

