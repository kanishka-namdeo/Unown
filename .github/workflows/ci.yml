name: CI

on:
  push:
    branches: [main]
  pull_request:

# Required CI gates (docs/testing-strategy.md §3): lint, typecheck, unit tests,
# shell syntax, theme contract. The mermaid render check and the build job are
# deliberately deferred — see the trailing comments.

jobs:
  lint:
    name: Lint dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint
        run: bunx eslint src

  typecheck:
    name: Typecheck dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma client
        # src/generated/prisma is gitignored output; tsc needs it for src/lib/db.ts
        run: bun run db:generate
      - name: Typecheck
        run: bun run typecheck

  unit:
    name: Unit tests (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Unit tests
        # bun:test is built in — no vitest/jest config or extra deps needed
        run: bun test src

  shell-syntax:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n scripts/*.sh
        run: |
          failed=0
          for f in scripts/*.sh; do
            echo "bash -n $f"
            if ! bash -n "$f"; then
              echo "::error file=$f::syntax error"
              failed=1
            fi
          done
          exit $failed

  theme:
    name: Theme contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Theme schema check
        # bun (not node) because the script imports a .ts file from pi-repo
        run: bun scripts/check_theme.mjs

# NOT in CI yet, on purpose:
# - `bun run build` — heavy; Vercel already builds on every push. Phase 2 adds
#   it as a required gate before deploy (testing-strategy.md §3 gate 3).
# - scripts/mermaid_check.mjs — needs Playwright + browser binaries + CDN;
#   belongs to the screenshot/visual pipeline (Phase 2/3), not a cheap gate.
# - scripts/verify_sandbox.mjs / bwrap_smoke.sh — run only on changes under
#   sandbox/bwrap surfaces (testing-strategy.md §3 gate 6, Phase 3).
