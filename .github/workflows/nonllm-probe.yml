name: nonllm probe

# Cross-platform validation lane for the NON-LLM testbench (H9 in
# benchmarks/nonllm/hypotheses.json): proves the transformers.js +
# onnxruntime-node encoder lane (bge-small q8 embeddings + ms-marco
# cross-encoder) loads and runs on every OS Unown supports — before any
# conclusion or integration. Keyless: models download from the HF hub into
# the gitignored bench cache; remote-comparison experiments (N1-N5) run
# where a bridge is reachable, never in CI.

on:
  push:
    branches: [main]
    paths:
      - "benchmarks/nonllm/**"
      - ".github/workflows/nonllm-probe.yml"
  pull_request:
    paths:
      - "benchmarks/nonllm/**"
      - ".github/workflows/nonllm-probe.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: benchmarks/nonllm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Gate the render layer first (no install, no models): the null-safety
      # contract pinned after local-llm's red run 39123722085.
      - name: Renders unit tests (null-safety contract, no install)
        run: node --test "lib/renders.test.mjs"

      - name: Install bench deps (transformers.js + onnxruntime-node prebuilt)
        run: npm install --no-fund --no-audit

      - name: N0 runtime probe (load + embed + rerank, keyless)
        run: node runner.mjs probe

      # Campaign-#2 lanes (H16/H18): the Ettin base+JS-head reranker and the
      # injection classifier. Keyless: base weights + head safetensors +
      # classifier ONNX all download from the HF hub on first use.
      - name: N0b campaign-2 lane probe (ettin + injection classifier, keyless)
        run: node runner.mjs probe2

      - name: Assert campaign-2 lane thresholds
        shell: node {0}
        working-directory: .
        run: |
          const fs = require("fs");
          const path = require("path");
          const glob = path.join("benchmarks", "nonllm", "results");
          const dirs = fs.readdirSync(glob).filter((d) => d.startsWith("probe2"));
          if (!dirs.length) { console.error("no probe2 results dir"); process.exit(1); }
          const newest = dirs
            .map((d) => ({ d, m: fs.statSync(path.join(glob, d, "n0b-probe.json")).mtimeMs }))
            .sort((a, b) => b.m - a.m)[0].d;
          const probe = JSON.parse(fs.readFileSync(path.join(glob, newest, "n0b-probe.json"), "utf8"));
          const fail = [];
          for (const r of probe.summary.results) {
            const tag = `${r.model} on ${probe.summary.runtime.platform}`;
            if (!r.loadOk) { fail.push(`${tag}: load failed — ${r.error ?? "?"}`); continue; }
            // Calibration (2026-10-18, first run): generous first-pass bounds —
            // local linux-x64 measured ettin 12ms/pair, guard 4ms/case. The
            // ms-marco lane's slowest platform (darwin-arm64) runs ~3x linux;
            // ettin is fp32 (no q8 artifact) so it gets the wider budget.
            // Tighten after the first 3-OS receipt lands (repo discipline).
            const lat = r.pairLatencyMs ?? r.latencyPerCaseMs;
            if (lat !== undefined && lat !== null && lat > 200) fail.push(`${tag}: lane latency ${lat}ms > 200ms`);
            if (r.rssDeltaMB !== undefined && r.rssDeltaMB !== null && r.rssDeltaMB > 500) fail.push(`${tag}: rss +${r.rssDeltaMB}MB > 500MB`);
            if (r.discriminates === false) fail.push(`${tag}: sanity pair FAILED to discriminate (relevant must outscore irrelevant)`);
          }
          if (fail.length) { console.error("CAMPAIGN-2 LANE FAILURES:\n- " + fail.join("\n- ")); process.exit(1); }
          console.log("campaign-2 lane thresholds OK on " + process.platform);

      - name: Assert H9 thresholds
        shell: node {0}
        working-directory: .
        run: |
          const fs = require("fs");
          const path = require("path");
          const glob = path.join("benchmarks", "nonllm", "results");
          const dirs = fs.readdirSync(glob).filter((d) => d.startsWith("probe"));
          if (!dirs.length) { console.error("no probe results dir"); process.exit(1); }
          const newest = dirs
            .map((d) => ({ d, m: fs.statSync(path.join(glob, d, "n0-probe.json")).mtimeMs }))
            .sort((a, b) => b.m - a.m)[0].d;
          const probe = JSON.parse(fs.readFileSync(path.join(glob, newest, "n0-probe.json"), "utf8"));
          const fail = [];
          for (const r of probe.summary.results) {
            const tag = `${r.model} on ${r.model && probe.summary.runtime.platform}`;
            if (!r.loadOk) { fail.push(`${tag}: load failed — ${r.error ?? "?"}`); continue; }
            if (r.embedP50ms !== undefined && r.embedP50ms !== null && r.embedP50ms > 250) fail.push(`${tag}: embed p50 ${r.embedP50ms}ms > 250ms`);
            // 50ms/pair: calibrated on REAL cross-encoder inference — linux 11ms,
            // win 8ms, darwin-arm64 32ms (slowest observed ORT platform). Still
            // ~175x cheaper than the remote scoring call it replaces (~5.6s).
            // (The saturation bug class — pipeline softmaxing the single logit
            // to 1.0 — shows up as degenerate scores, caught by N3's variance
            // check, not by latency.)
            if (r.rerankP50ms !== undefined && r.rerankP50ms !== null && r.rerankP50ms > 50) fail.push(`${tag}: rerank p50 ${r.rerankP50ms}ms/pair > 50ms`);
            if (r.rssDeltaMB !== undefined && r.rssDeltaMB !== null && r.rssDeltaMB > 400) fail.push(`${tag}: rss +${r.rssDeltaMB}MB > 400MB`);
          }
          if (fail.length) { console.error("H9 THRESHOLD FAILURES:\n- " + fail.join("\n- ")); process.exit(1); }
          console.log("H9 thresholds OK on " + process.platform + " (" + probe.summary.results.length + " models)");

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonllm-probe-${{ matrix.os }}
          path: benchmarks/nonllm/results/
          retention-days: 14
