# Release workflow — runs on version tags (vX.Y.Z).
#
# Unown is clone-to-install (the vendored pi-repo workspace layout is NOT
# npm-publishable by design — see AGENTS.md "Root Contracts"). A release is
# therefore a VERIFIED GIT TAG plus, since 2026-10-19, per-OS standalone
# binaries of the `unown` CLI:
#
#   1. the full install path on all three OSes (the same real-installer
#      matrix CI runs — a release that does not install cleanly does not
#      exist),
#   2. the production landing build + standalone-server smoke,
#   3. the engine suite + integration suite + bridge suite + version
#      consistency + CLI smokes (the release assertion: strategy §12
#      criterion 2),
#   4. an SBOM (SPDX) of the installed tree + a build-provenance
#      attestation for the checkout,
#   5. SIX per-OS CLI binaries (darwin/linux/windows × arm64/x64) built by ONE
#      ubuntu runner — `bun build --compile --target=` cross-compiles by
#      downloading the target's runtime, so no Mac or Windows machine is
#      needed to PRODUCE them,
#   6. smoke tests that download and RUN each platform's own archive on that
#      platform. A runner can only execute its own OS's output, so this is the
#      only leg that proves a shipped binary boots — a build job alone compiles
#      binaries it has never run. windows-arm64 has no GitHub-hosted runner at
#      all, so it is the one asset shipped without a runtime smoke (the
#      checklist says so instead of claiming otherwise),
#   7. a GitHub Release, created only after the smoke passes, with the
#      archives + checksums + SBOM + checklist attached and generated notes.
#
# The binaries are UNSIGNED: no Apple Developer account and no code-signing
# secret lives in this repo (decision 2026-10-19). Gatekeeper and SmartScreen
# therefore warn on first run, and each archive carries an INSTALL.txt with the
# exact workaround, so the friction is documented where it is hit.
#
# Tagging: `git tag v0.0.2 && git push origin v0.0.2`. The tag MUST match
# package.json version — asserted below before anything else runs. The
# version line was reset on 2026-10-21: releases are 0.0.x and increment in
# patch order (0.0.1, then 0.0.2, then 0.0.3, and so on) until otherwise
# specified.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Release assertion (3-OS install + full suites + build)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Tag matches package.json version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          actual="${GITHUB_REF_NAME}"
          echo "tag: $actual / package.json: $expected"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $actual does not match package.json $expected — bump before tagging"
            exit 1
          fi
      - name: Install via the real installer
        env:
          UNOWN_NO_LINK: "1"
        run: bun scripts/install.ts
      - name: Engine unit suite
        working-directory: pi-repo/packages/self-learning
        run: bun test test/
      - name: Engine integration suite (real server + mock bridge)
        working-directory: pi-repo/packages/self-learning
        env:
          PI_TEST_SCOPE: integration
        run: bun test test/integration/
      - name: Bridge unit suite
        working-directory: mini-services/llm-bridge
        run: bun test pure.test.ts
      - name: Version consistency
        # shell: bash is NOT optional on the windows leg (default pwsh makes
        # this POSIX step a ParserError) — the exact bug the CI workflow's
        # twin step fixed at 517a4f2; this copy was missed then and went red
        # in the first release run (39106607335).
        shell: bash
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(bun bin/unown --version)
          [ "$expected" = "$actual" ] || { echo "::error::version mismatch: $expected vs $actual"; exit 1; }
      - name: CLI smokes (help + doctor table)
        shell: bash
        run: |
          bun bin/unown --help >/dev/null
          code=0
          out="$(bun bin/unown doctor 2>&1)" || code=$?
          [ "$code" -le 1 ] || { echo "::error::doctor crashed (exit $code)"; exit 1; }
          printf '%s\n' "$out" | grep -q "agent dir" || { echo "::error::doctor table missing"; exit 1; }
      - name: Artifact plan gate
        # Two traps, both measured on bash 5.2.21. (1) `x=$(cmd | wc -l)` under
        # GitHub's `bash -eo pipefail` does NOT fail the step when cmd dies — the
        # shell aborts at the assignment with exit status 0, i.e. a green step
        # that checked nothing; so the producer runs as its own statement and the
        # count reads a file, with `|| true` so a zero-match grep cannot itself
        # become that silent pass. (2) `A && B` as a statement returns non-zero
        # when A is false, which set -e then aborts — every optional test below is
        # an explicit `if`.
        shell: bash
        run: |
          set -euo pipefail
          if ! bun scripts/build-artifacts.ts --dry-run > artifact-plan.txt; then
            echo "::error::the artifact builder could not even print its plan"; exit 1; fi
          n=$(grep -c . artifact-plan.txt || true)
          if [ "$n" != "7" ]; then
            echo "::error::the plan is $n lines, expected a header plus 6 targets"; cat artifact-plan.txt; exit 1; fi
          for p in darwin-arm64 darwin-x64 linux-arm64 linux-x64 windows-arm64 windows-x64; do
            if ! grep -q "^$p" artifact-plan.txt; then
              echo "::error::$p is not in the build plan — a target disappeared"; exit 1; fi
          done
          rm -f artifact-plan.txt
          node --test scripts/build-artifacts.test.mjs

  build:
    name: Production build + per-OS artifacts + SBOM
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"
      - name: Install (landing deps + built pi workspace)
        # The compiled artifacts import pi's BUILT output: the image-resize
        # worker is a second compile entrypoint and lives under
        # pi-repo/packages/coding-agent/dist. So this job runs the same
        # build:offline step the installer runs — otherwise the builder exits
        # with its "the vendored pi workspace must be built first" message.
        env:
          UNOWN_NO_LINK: "1"
        run: bun scripts/install.ts
      - name: Production build
        run: bun run build
      - name: Standalone server smoke
        run: |
          PORT=3210 node .next/standalone/server.js &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -sf -m 2 http://127.0.0.1:3210/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf -m 5 http://127.0.0.1:3210/ >/dev/null
          kill $server_pid
      - name: Build the six per-OS CLI artifacts
        run: bun scripts/build-artifacts.ts --out release-assets
      - name: Every planned artifact exists, and no extra
        # Closest gate to the producer: the builder exits 0 after compiling
        # whatever it was given, so the plan (verify job) and the payload are
        # compared here rather than at publish time.
        shell: bash
        run: |
          set -euo pipefail
          if ! bun scripts/build-artifacts.ts --list-platforms > planned.txt; then
            echo "::error::could not read the build plan"; exit 1; fi
          for p in $(cat planned.txt); do
            case "$p" in
              windows-*) want="unown-$p.zip" ;;
              *) want="unown-$p.tar.gz" ;;
            esac
            if [ ! -f "release-assets/$want" ]; then
              echo "::error::the builder planned $p but produced no release-assets/$want"; exit 1; fi
          done
          rm -f planned.txt
          # find, not `ls glob | wc -l`: an unmatched glob makes ls exit non-zero,
          # and inside $(( $(…) )) that is how a count becomes a silent green step.
          n=$(find release-assets -maxdepth 1 \( -name 'unown-*.tar.gz' -o -name 'unown-*.zip' \) | wc -l)
          if [ "$n" != "6" ]; then echo "::error::found $n archives, expected exactly 6"; exit 1; fi
          if [ ! -f release-assets/sha256sums.txt ]; then echo "::error::no sha256sums.txt in the payload"; exit 1; fi
      - name: SBOM (SPDX) of the dependency tree
        # syft scans the installed node_modules + vendored pi-repo tree (the
        # runtime dependency surface a clone-to-install user actually gets).
        # Installed explicitly rather than via anchore/sbom-action so the
        # SPDX JSON lands at a KNOWN path and is attached to the release
        # deterministically (the action's artifact upload raced the release
        # creation — one run attached the SBOM, the next did not).
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft dir:. -o spdx-json=release-assets/sbom-spdx.json
          ls -la release-assets/sbom-spdx.json
      - name: Build provenance attestation (subject digest)
        # The attestation action requires a SHA-256 subject digest —
        # github.sha is git's SHA-1, which it rejects (found red in run
        # 39107793393). The digest is the SHA-256 of the raw commit OBJECT:
        # verifiable by anyone via `git cat-file commit <sha> | sha256sum`.
        id: digest
        run: echo "sha=sha256:$(git cat-file commit ${{ github.sha }} | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Build provenance attestation
        # SLSA Build L3 provenance for the source checkout the release was
        # verified against (the repo's release artifact IS the tag).
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: "kanishka-namdeo/Unown@${{ github.ref_name }}"
          subject-digest: ${{ steps.digest.outputs.sha }}
      - name: Release checklist (what was verified)
        run: |
          {
            echo "## Release verification receipt"
            echo
            echo "- 3-OS real-installer matrix (ubuntu/macos/windows): install.ts → engine unit suite → integration suite (real server + mock bridge) → bridge suite → version consistency → CLI smokes — all green"
            echo "- Production landing build + standalone server smoke (/ answered 200)"
            echo "- Six per-OS \`unown\` CLI binaries built by one ubuntu runner from $(node -p "require('./package.json').version"); five of the six were then downloaded, extracted and EXECUTED on their own OS (linux arm64+x64, darwin arm64+x64, windows x64). windows-arm64 ships untested: GitHub has no arm64 Windows runner."
            echo "- SBOM (SPDX) and sha256sums.txt attached; build-provenance attestation recorded for the tag"
            echo "- \`unown --version\` === package.json.version === tag, in the checkout AND in every smoke-tested binary"
            echo
            echo "Binaries are UNSIGNED (no code-signing secret in this repo). macOS"
            echo "Gatekeeper and Windows SmartScreen warn on first run; INSTALL.txt inside each"
            echo "archive gives the workaround (xattr -d com.apple.quarantine unown /"
            echo "Unblock-File unown.exe)."
          } > release-assets/release-checklist.md
          cat release-assets/release-checklist.md
      - name: sha256sums.txt (integrity of every release asset)
        # One manifest for the whole release, over the archives AND the
        # metadata — verifiable by anyone:
        #   curl -sLO <release>/sha256sums.txt && sha256sum -c sha256sums.txt
        # This overwrites the builder's archives-only file of the same name, so
        # exactly one checksum asset exists on the release page.
        working-directory: release-assets
        shell: bash
        run: |
          sha256sum release-checklist.md sbom-spdx.json unown-*.tar.gz unown-*.zip | sort -k2 > sha256sums.txt
          cat sha256sums.txt
          # self-check: the manifest must cover exactly the 6 archives + 2 files
          [ "$(wc -l < sha256sums.txt)" = "8" ] || { echo "::error::sha256sums.txt has the wrong number of entries"; exit 1; }
      - name: Upload release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-payload-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke-artifacts:
    name: Run the artifact on ${{ matrix.runner }} (${{ matrix.platform }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each leg extracts the archive built for ITS OWN os/arch and runs it.
        # No windows-arm64 leg exists because GitHub hosts no arm64 Windows
        # runner; that asset is labelled untested in the checklist.
        include:
          - runner: ubuntu-latest
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-latest
            platform: darwin-arm64
          - runner: macos-13
            platform: darwin-x64
          - runner: windows-latest
            platform: windows-x64
    steps:
      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-payload-${{ github.ref_name }}
          path: payload
      - name: Verify the checksum manifest
        # sha256sum ships in the Git Bash toolchain on all three runner OSes.
        shell: bash
        run: cd payload && sha256sum -c sha256sums.txt
      - name: Extract this platform's archive
        shell: bash
        run: |
          set -euo pipefail
          # Glob loop, not `archive="$(ls payload/unown-<p>.* | head -1)"`: with no
          # match ls exits non-zero, and inside a command substitution GitHub's
          # `bash -eo pipefail` aborts the step with status 0 — the missing archive
          # would have read as a pass. An unmatched glob simply stays literal and
          # fails the -e test, so the guard below is the thing that speaks.
          archive=""
          for f in payload/unown-${{ matrix.platform }}.*; do
            if [ -e "$f" ]; then archive="$f"; break; fi
          done
          if [ -z "$archive" ]; then
            echo "::error::the payload has no archive for ${{ matrix.platform }}"; exit 1; fi
          echo "archive: $archive"
          mkdir -p extracted
          case "$archive" in
            *.zip)
              # Not unzip: not guaranteed on the Windows runner's PATH. The zip
              # itself is written by bsdtar/GNU zip with "/" separators, which
              # Expand-Archive reads correctly.
              export ARCHIVE_PATH="$(cygpath -w "$archive" 2>/dev/null || echo "$archive")"
              export DESTINATION_PATH="$(cygpath -w extracted 2>/dev/null || echo "$PWD/extracted")"
              powershell.exe -NoProfile -NonInteractive -Command 'Expand-Archive -LiteralPath $env:ARCHIVE_PATH -DestinationPath $env:DESTINATION_PATH -Force'
              ;;
            *)
              tar -xzf "$archive" -C extracted
              ;;
          esac
          ls -R extracted
      - name: Run it
        shell: bash
        run: |
          set -euo pipefail
          bin="extracted/unown-${{ matrix.platform }}/unown"
          if [ ! -f "$bin" ]; then bin="$bin.exe"; fi
          if [ ! -f "$bin" ]; then
            echo "::error::the archive for ${{ matrix.platform }} contained no runnable binary"; exit 1; fi
          chmod +x "$bin" 2>/dev/null || true
          # `if !` because a version probe that dies must be a NAMED failure:
          # version="$($bin --version)" alone aborts this step with status 0 under
          # GitHub's pipefail shell, which would publish a release whose binaries
          # never ran.
          if ! version="$("$bin" --version 2>&1)"; then
            echo "::error::the shipped binary could not report a version: $version"; exit 1; fi
          echo "binary reports: $version (tag: ${GITHUB_REF_NAME#v})"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::the shipped binary reports $version, the tag is ${GITHUB_REF_NAME#v} — the version define did not land"
            exit 1; fi
          "$bin" --help | grep -q "self-improving terminal coding agent"
          code=0
          out="$("$bin" doctor 2>&1)" || code=$?
          [ "$code" -le 1 ] || { echo "::error::doctor crashed in the binary (exit $code)"; exit 1; }
          printf '%s\n' "$out" | grep -q "agent dir" || { echo "::error::doctor table missing in the binary"; exit 1; }
          # The binary must KNOW it has no checkout: that is what makes
          # `unown update` refuse instead of running git in a void.
          printf '%s\n' "$out" | grep -q "not a git checkout" || {
            echo "::error::the binary does not detect the detached layout — the update path will misbehave"
            exit 1; }
      - name: INSTALL.txt documents the signing friction
        shell: bash
        run: |
          set -euo pipefail
          note="extracted/unown-${{ matrix.platform }}/INSTALL.txt"
          grep -q "sha256sums.txt" "$note"
          case "${{ matrix.platform }}" in
            darwin-*) grep -q "com.apple.quarantine" "$note" ;;
            windows-*) grep -q "Unblock-File" "$note" ;;
            *) grep -q "unown setup" "$note" ;;
          esac

  publish-release:
    name: Create the GitHub Release
    needs:
      - build
      - smoke-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-payload-${{ github.ref_name }}
          path: release-assets
      - name: Assert the full asset set is present
        # softprops silently skips a file that is not there, so a release that
        # quietly lost three of six binaries would still publish green. The nine
        # names are spelled out here: they must equal the `files:` list below,
        # and they are the same six targets the builder's suite and the verify
        # job's plan gate pin.
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          expected=(
            unown-darwin-arm64.tar.gz unown-darwin-x64.tar.gz
            unown-linux-arm64.tar.gz unown-linux-x64.tar.gz
            unown-windows-arm64.zip unown-windows-x64.zip
            sha256sums.txt sbom-spdx.json release-checklist.md
          )
          for f in "${expected[@]}"; do
            test -f "$f" || { echo "::error::missing release asset: $f"; exit 1; }
          done
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(ls | sort) || {
            echo "::error::the payload holds a file the release does not expect, or is missing one"
            exit 1; }
          sha256sum -c sha256sums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          draft: false
          files: |
            release-assets/unown-darwin-arm64.tar.gz
            release-assets/unown-darwin-x64.tar.gz
            release-assets/unown-linux-arm64.tar.gz
            release-assets/unown-linux-x64.tar.gz
            release-assets/unown-windows-arm64.zip
            release-assets/unown-windows-x64.zip
            release-assets/sha256sums.txt
            release-assets/sbom-spdx.json
            release-assets/release-checklist.md
          body_path: release-assets/release-checklist.md
