  <g fill="none" stroke="#f4f1ea" stroke-width="4" stroke-linecap="round">
    <path d="M14 40 C 24 20, 34 44, 44 24 S 54 28 54 28"/>
    <path d="M14 28 C 24 46, 36 18, 46 38"/>
  </g>
  <circle cx="50" cy="24" r="3.5" fill="#f4f1ea"/>
</svg>
