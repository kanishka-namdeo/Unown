<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0a5dc2"/>
  <!-- The chaconne bar: a descending step figure (the passacaglia's
       ground bass, abstracted) — five bars falling in steps. -->
  <g fill="#ffffff">
    <rect x="14" y="18" width="7" height="28" rx="2"/>
    <rect x="25" y="24" width="7" height="28" rx="2"/>
    <rect x="36" y="30" width="7" height="22" rx="2"/>
    <rect x="47" y="36" width="7" height="16" rx="2"/>
  </g>
</svg>
